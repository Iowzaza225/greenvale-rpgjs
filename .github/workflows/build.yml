name: Greenvale Build Check

concurrency:
  group: greenvale-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, feature/greenvale-menu-quests, phase/0-foundation, phase/1-character-onboarding, phase/2-character-jobs, phase/3-skills, phase/4-combat-status ]
  pull_request:
    branches: [ main, feature/greenvale-menu-quests, phase/0-foundation, phase/1-character-onboarding, phase/2-character-jobs, phase/3-skills ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.6.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          RPG_TYPE: rpg

      - name: Check dist
        run: |
          test -f dist/index.html
          echo "=== DIST INDEX ==="
          grep -E "Greenvale|assets/" dist/index.html | head -80
          echo "=== DIST FILES ==="
          find dist -maxdepth 2 -type f -printf "%p %s bytes\n" | sort

      - name: Install WebKit for iPhone smoke test
        run: pnpm exec playwright install --with-deps webkit

      - name: Phase 0 boot regression
        run: pnpm run test:phase0

      - name: Phase 1 iPhone WebKit onboarding
        run: pnpm run test:phase1

      - name: Phase 2 iPhone WebKit character progression
        run: pnpm run test:phase2

      - name: Phase 3 iPhone WebKit skills
        run: pnpm run test:phase3

      - name: Phase 4 iPhone WebKit combat
        run: pnpm run test:phase4

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: greenvale-playwright-results
          path: test-results
          if-no-files-found: ignore

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: greenvale-dist
          path: dist
