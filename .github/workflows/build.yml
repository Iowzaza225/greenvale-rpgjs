name: Greenvale Build Check

on:
  push:
    branches: [ main, feature/greenvale-menu-quests ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.6.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          RPG_TYPE: rpg

      - name: Check dist
        run: |
          test -f dist/index.html
          echo "=== DIST INDEX ==="
          cat dist/index.html
          echo "=== DIST FILES ==="
          find dist -maxdepth 2 -type f -printf "%p %s bytes\n" | sort

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: greenvale-dist
          path: dist
