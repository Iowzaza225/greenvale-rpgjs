name: Greenvale Build Check

on:
  push:
    branches: [ main, feature/greenvale-menu-quests ]
  pull_request:
    branches: [ main, feature/greenvale-menu-quests ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.6.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          RPG_TYPE: rpg

      - name: Check dist
        run: |
          test -f dist/index.html
          echo "=== DIST INDEX ==="
          cat dist/index.html
          echo "=== DIST FILES ==="
          find dist -maxdepth 2 -type f -printf "%p %s bytes\n" | sort

      - name: Install WebKit for phase QA
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps webkit

      - name: Phase 0 iPhone WebKit boot smoke
        if: github.event_name == 'pull_request'
        run: pnpm run test:phase0

      - name: Upload Playwright traces on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: phase0-playwright-results
          path: test-results
          if-no-files-found: ignore

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: greenvale-dist
          path: dist
