<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#13251a" />
  <title>Greenvale: After the Fall — RPGJS V2.3 Runtime Fix</title>
  <script>
    window.__GV_BOOT_ERRORS__ = [];
    window.__GV_ENTRY_STARTED__ = false;
    window.__GV_CANVAS_READY__ = false;
    window.__GV_SHOW_ERROR__ = function(message) {
      const text = String(message || 'Unknown runtime error');
      window.__GV_BOOT_ERRORS__.push(text);
      const render = () => {
        const el = document.getElementById('runtime-error');
        if (!el) return;
        el.style.display = 'block';
        const out = document.getElementById('runtime-error-text');
        if (out) out.textContent = window.__GV_BOOT_ERRORS__.slice(-3).join('\n\n');
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', render, { once:true });
      } else render();
    };
    window.addEventListener('error', (event) => {
      const e = event.error;
      window.__GV_SHOW_ERROR__('JS ERROR\n' + (e?.stack || event.message || 'unknown'));
    });
    window.addEventListener('unhandledrejection', (event) => {
      const r = event.reason;
      window.__GV_SHOW_ERROR__('PROMISE ERROR\n' + (r?.stack || r?.message || String(r)));
    });
  </script>
  <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/index.css">
  <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/theme-default.css">
</head>
<body class="rpg-ui-app">
  <div id="build-stamp">RPGJS V2.3 RUNTIME FIX</div>
  <div id="rpg"></div>
  <div id="runtime-error" style="display:none;position:fixed;left:16px;right:16px;top:18%;z-index:999999;background:#221211;color:#ffe8c4;border:2px solid #e7ad4d;border-radius:16px;padding:16px;font:600 13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow:auto;max-height:58vh;box-shadow:0 12px 40px #000a">
    <b style="display:block;color:#ffd66b;font:800 17px system-ui;margin-bottom:10px">GREENVALE RUNTIME ERROR</b>
    <div id="runtime-error-text"></div>
  </div>
  <script>
    setTimeout(() => {
      if (window.__GV_CANVAS_READY__) return;
      const state = window.__GV_ENTRY_STARTED__
        ? 'RPGJS entry started แต่ยังไม่สร้าง canvas'
        : 'RPGJS entry ยังไม่เริ่ม';
      window.__GV_SHOW_ERROR__('BOOT WATCHDOG\n' + state + '\nURL: ' + location.href);
    }, 8000);
  </script>
</body>
</html>
