<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#13251a" />
  <title>Greenvale: After the Fall — RPGJS V2.2</title>
  <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/index.css">
  <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/theme-default.css">
</head>
<body class="rpg-ui-app">
  <div id="build-stamp">RPGJS V2.2 GITHUB BUILD</div>
  <div id="rpg"></div>
  <div id="deploy-diagnostic" style="display:none;position:fixed;inset:18% 8% auto;z-index:999999;background:#102219;color:#f5e6a9;border:2px solid #b99a4a;border-radius:16px;padding:18px;font:600 14px/1.55 system-ui;text-align:center;box-shadow:0 12px 36px #0008">
    <b style="font-size:18px">RPGJS ยังไม่ได้ Build</b><br><br>
    ถ้าเห็นกล่องนี้บน production แปลว่า bundle ยังไม่เริ่มทำงาน
  </div>
  <script>
    setTimeout(()=>{
      if(!window.__GREENVALE_RPGJS_LOADED__){
        const el=document.getElementById('deploy-diagnostic');
        if(el) el.style.display='block';
      }
    },7000)
  </script>
</body>
</html>
